<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bé hiểu Vy đến mức nào?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #fff5f8 0%, #eef6ff 100%);
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 860px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(31, 41, 55, 0.08);
      padding: 28px;
    }

    h1 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 8px;
      color: #be185d;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .progress-bar {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .question-box {
      background: #fdf2f8;
      border: 1px solid #fbcfe8;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .question-text {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option-btn {
      text-align: left;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid #e5e7eb;
      background: #ffffff;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      border-color: #ec4899;
      background: #fff1f7;
    }

    .option-btn.selected {
      border-color: #db2777;
      background: #fce7f3;
      font-weight: 600;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 11px 18px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    .btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #ec4899;
      color: #ffffff;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }

    .result-box {
      text-align: center;
      padding: 20px;
      border-radius: 16px;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      margin-bottom: 20px;
    }

    .result-score {
      font-size: 28px;
      font-weight: 700;
      color: #0369a1;
      margin: 8px 0;
    }

    /* Chặng cuối */
    .journey-wrap {
      margin-top: 16px;
    }

    .journey-stage {
      width: 100%;
      overflow: hidden;
      border-radius: 20px;
      background: #eff6ff;
      border: 1px solid #dbeafe;
    }

    #flight-svg {
      display: block;
      width: 100%;
      height: auto;
    }

    #plane-btn {
      cursor: pointer;
    }

    .flight-hint {
      margin-top: 10px;
      font-size: 14px;
      color: #4b5563;
      text-align: center;
    }

    .arrival-message {
      margin-top: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #be185d;
      text-align: center;
      min-height: 22px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Bé hiểu Vy đến mức nào?</h1>
    <p class="subtitle">Hoàn thành trắc nghiệm để mở chặng bay tới gặp Kvy nhé!</p>

    <!-- Màn hình trắc nghiệm -->
    <section id="quiz-screen" class="screen active">
      <div class="progress-bar">
        <span id="question-counter">Câu 1 / 3</span>
        <span id="score-counter">Điểm: 0</span>
      </div>

      <div class="question-box">
        <div id="question-text" class="question-text"></div>
        <div id="options-list" class="options"></div>
      </div>

      <div class="actions">
        <button id="next-btn" class="btn btn-primary" type="button" disabled>Câu tiếp theo</button>
        <button id="open-journey-btn" class="btn btn-secondary" type="button">Đi tới chặng cuối</button>
      </div>
    </section>

    <!-- Màn hình kết quả & chặng cuối -->
    <section id="journey-screen" class="screen">
      <div class="result-box">
        <div>Tổng kết của bé</div>
        <div id="final-score" class="result-score">0 / 3</div>
        <p id="result-comment">Bấm máy bay để Ntran bay tới đứng kế Kvy nào!</p>
      </div>

      <div id="journey-scene" class="journey-wrap">
        <div class="journey-stage">
          <svg id="flight-svg" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#e0f2fe" />
                <stop offset="100%" stop-color="#fdf2f8" />
              </linearGradient>
              <linearGradient id="routeGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#ec4899" />
                <stop offset="100%" stop-color="#3b82f6" />
              </linearGradient>
            </defs>

            <rect x="0" y="0" width="800" height="340" rx="20" fill="url(#skyGrad)" />

            <path
              id="flight-path"
              d="M 115 235 Q 400 45 685 235"
              fill="none"
              stroke="url(#routeGrad)"
              stroke-width="3.5"
              stroke-dasharray="9 9"
              stroke-linecap="round"
              opacity="0.85"
            />

            <!-- Nhân vật Ntran -->
            <g id="ntran-group" transform="translate(115, 235)">
              <circle cx="0" cy="-46" r="17" fill="#ffd6e0" stroke="#e11d48" stroke-width="2" />
              <circle cx="-5.5" cy="-47" r="2" fill="#1f2937" />
              <circle cx="5.5" cy="-47" r="2" fill="#1f2937" />
              <path d="M -5 -40 Q 0 -35 5 -40" fill="none" stroke="#be123c" stroke-width="2" />
              <rect x="-14" y="-26" width="28" height="28" rx="8" fill="#fb7185" />
              <rect x="-34" y="12" width="68" height="26" rx="12" fill="#ffffff" stroke="#fda4af" />
              <text x="0" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#9f1239">Ntran</text>
            </g>

            <!-- Nhân vật Kvy -->
            <g id="kvy-group" transform="translate(685, 235)">
              <circle cx="0" cy="-46" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
              <circle cx="-5.5" cy="-47" r="2" fill="#1f2937" />
              <circle cx="5.5" cy="-47" r="2" fill="#1f2937" />
              <path d="M -5 -40 Q 0 -35 5 -40" fill="none" stroke="#1d4ed8" stroke-width="2" />
              <rect x="-14" y="-26" width="28" height="28" rx="8" fill="#60a5fa" />
              <rect x="-34" y="12" width="68" height="26" rx="12" fill="#ffffff" stroke="#93c5fd" />
              <text x="0" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Kvy</text>
            </g>

            <!-- Máy bay di chuyển dọc đường bay -->
            <g id="plane-btn" transform="translate(115, 235)">
              <g id="plane-rotator" transform="rotate(0)">
                <circle class="plane-pulse" cx="0" cy="0" r="22" fill="#ec4899" opacity="0.16" />
                <polygon points="18,0 -12,-11 -6,0 -12,11" fill="#ec4899" stroke="#ffffff" stroke-width="1.5" />
              </g>
            </g>
          </svg>
        </div>

        <p id="flight-hint" class="flight-hint">Bấm vào máy bay để bắt đầu chuyến bay tới Kvy!</p>
        <div id="arrival-message" class="arrival-message"></div>

        <div class="actions">
          <button id="replay-flight-btn" class="btn btn-secondary" type="button">Bay lại lần nữa</button>
          <button id="replay-btn" class="btn btn-primary" type="button">Làm lại trắc nghiệm</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "Câu 1: Món đồ uống yêu thích của Vy là gì?",
        options: ["Trà sữa", "Cà phê đá", "Nước cam", "Matcha latte"],
        answer: 0
      },
      {
        question: "Câu 2: Vy thích đi chơi ở đâu vào cuối tuần?",
        options: ["Quán cà phê yên tĩnh", "Trung tâm thương mại", "Công viên dạo mát", "Ở nhà xem phim"],
        answer: 2
      },
      {
        question: "Câu 3: Màu sắc nào hợp với Vy nhất?",
        options: ["Hồng pastel", "Xanh dương", "Trắng kem", "Tím nhạt"],
        answer: 0
      }
    ];

    const quizScreen = document.getElementById("quiz-screen");
    const journeyScreen = document.getElementById("journey-screen");
    const questionCounterEl = document.getElementById("question-counter");
    const scoreCounterEl = document.getElementById("score-counter");
    const questionTextEl = document.getElementById("question-text");
    const optionsListEl = document.getElementById("options-list");
    const nextBtn = document.getElementById("next-btn");
    const openJourneyBtn = document.getElementById("open-journey-btn");
    const finalScoreEl = document.getElementById("final-score");
    const resultCommentEl = document.getElementById("result-comment");
    const replayBtn = document.getElementById("replay-btn");

    let currentIndex = 0;
    let score = 0;
    let selectedOption = null;

    function switchScreen(targetScreen) {
      quizScreen.classList.remove("active");
      journeyScreen.classList.remove("active");
      targetScreen.classList.add("active");
    }

    function renderQuestion() {
      const currentQ = questions[currentIndex];
      selectedOption = null;
      nextBtn.disabled = true;
      nextBtn.textContent = currentIndex === questions.length - 1 ? "Hoàn thành" : "Câu tiếp theo";

      questionCounterEl.textContent = `Câu ${currentIndex + 1} / ${questions.length}`;
      scoreCounterEl.textContent = `Điểm: ${score}`;
      questionTextEl.textContent = currentQ.question;
      optionsListEl.innerHTML = "";

      currentQ.options.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.textContent = optText;
        btn.addEventListener("click", () => {
          selectedOption = idx;
          document.querySelectorAll(".option-btn").forEach((el) => el.classList.remove("selected"));
          btn.classList.add("selected");
          nextBtn.disabled = false;
        });
        optionsListEl.appendChild(btn);
      });
    }

    function openJourney() {
      finalScoreEl.textContent = `${score} / ${questions.length}`;
      resultCommentEl.textContent =
        score === questions.length
          ? "Quá đỉnh! Bé hiểu Vy chuẩn từng milimet luôn!"
          : "Xong trắc nghiệm rồi, bấm máy bay để Ntran tới bên Kvy nhé!";
      switchScreen(journeyScreen);
    }

    nextBtn.addEventListener("click", () => {
      if (selectedOption === null) return;
      if (selectedOption === questions[currentIndex].answer) {
        score += 1;
      }
      currentIndex += 1;
      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        openJourney();
      }
    });

    openJourneyBtn.addEventListener("click", () => {
      openJourney();
    });

    // Khối điều khiển chuyến bay và nhân vật Ntran
    (function () {
      const pathEl = document.getElementById("flight-path");
      const planeEl = document.getElementById("plane-btn");
      const rotatorEl = document.getElementById("plane-rotator");
      const hintEl = document.getElementById("flight-hint");
      const msgEl = document.getElementById("arrival-message");
      const ntranEl = document.getElementById("ntran-group");
      const replayFlightBtn = document.getElementById("replay-flight-btn");

      if (!pathEl || !planeEl || !rotatorEl) return;

      const totalLen = pathEl.getTotalLength();
      const duration = 1800;
      let isFlying = false;
      let animId = null;

      function moveNtranToKvy() {
        if (!ntranEl) return;
        ntranEl.style.transition = "transform 0.7s ease";
        ntranEl.setAttribute("transform", "translate(600, 235)");
      }

      function resetNtranPos() {
        if (!ntranEl) return;
        ntranEl.style.transition = "transform 0.5s ease";
        ntranEl.setAttribute("transform", "translate(115, 235)");
      }

      function placeAt(progress) {
        const clamped = Math.max(0, Math.min(1, progress));
        const dist = clamped * totalLen;
        const pt = pathEl.getPointAtLength(dist);
        const delta = 2;
        const p1 = pathEl.getPointAtLength(Math.max(0, dist - delta));
        const p2 = pathEl.getPointAtLength(Math.min(totalLen, dist + delta));
        const angleDeg = (Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180) / Math.PI;

        planeEl.setAttribute("transform", `translate(${pt.x}, ${pt.y})`);
        rotatorEl.setAttribute("transform", `rotate(${angleDeg})`);
      }

      function startFlight() {
        if (isFlying) return;
        isFlying = true;
        msgEl.textContent = "";
        hintEl.textContent = "Máy bay đang bay tới Kvy...";

        const startTime = performance.now();

        function step(now) {
          const elapsed = now - startTime;
          const progress = Math.min(1, elapsed / duration);
          placeAt(progress);

          if (progress < 1) {
            animId = requestAnimationFrame(step);
          } else {
            isFlying = false;
            hintEl.textContent = "Đã hạ cánh an toàn!";
            msgEl.textContent = "Ntran đã tới đứng kế Kvy rồi nè!";
            moveNtranToKvy();
          }
        }

        animId = requestAnimationFrame(step);
      }

      function resetFlight() {
        if (animId) {
          cancelAnimationFrame(animId);
          animId = null;
        }
        isFlying = false;
        placeAt(0);
        resetNtranPos();
        msgEl.textContent = "";
        hintEl.textContent = "Bấm vào máy bay để bắt đầu chuyến bay tới Kvy!";
      }

      planeEl.addEventListener("click", startFlight);
      if (replayFlightBtn) {
        replayFlightBtn.addEventListener("click", resetFlight);
      }

      if (replayBtn) {
        replayBtn.addEventListener("click", () => {
          resetFlight();
          currentIndex = 0;
          score = 0;
          switchScreen(quizScreen);
          renderQuestion();
        });
      }

      placeAt(0);
    })();

    renderQuestion();
  </script>
</body>
</html>
